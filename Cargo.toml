[workspace]
resolver = "2"
members = ["backbone", "bbt"]

[workspace.dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "0.4"
bincode = "2.0.0-rc.3"

# Observability
opentelemetry = { version = "0.28", features = ["trace"] }
opentelemetry_sdk = { version = "0.28", features = ["trace", "rt-tokio"] }
opentelemetry-resource-detectors = { version = "0.7" }
opentelemetry-otlp = { version = "0.28", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry-semantic-conventions = { version = "0.28" }
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter", "json"] }
tracing-opentelemetry = "0.29"

# LLM inference
llm = "1.3"

# Model downloading
hf-hub = "0.3"

# Regex for DDL extraction
regex = "1.10"

# Random number generation
rand = "0.8"

# Memory allocator
mimalloc = "0.1"

# Path/filesystem
once_cell = "1.19"
walkdir = "2.4"
ignore = "0.4"

# PDF processing
pdfium-render = "0.8"
lopdf = "0.32"

# OCR
tesseract = "0.15"

# ONNX (embeddings + reranking)
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }

# Vector DB
qdrant-client = ">=1.11, <1.13"

# Text processing
unicode-segmentation = "1.11"
unicode-normalization = "0.1"
tokenizers = "0.19"

# Hashing
sha2 = "0.10"

# Progress
indicatif = "0.17"
console = "0.15"

# HTTP server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Caching
lru = "0.12"

# UUID generation
uuid = { version = "1.10", features = ["v4", "serde"] }

# Datetime
chrono = { version = "0.4", features = ["serde"] }

# SQLite
rusqlite = { version = "0.32", features = ["bundled"] }

# System directories
dirs = "5.0"

# Testing
tempfile = "3.23"
